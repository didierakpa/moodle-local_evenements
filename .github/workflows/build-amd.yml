name: Build AMD modules

# Run by hand after changing amd/src: rebuilds amd/build with Moodle's Grunt.
# The built files are attached to the run (artifact "amd-build") and printed in the log, base64-encoded.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: 'postgres'
          POSTGRES_HOST_AUTH_METHOD: 'trust'
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 3

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
        with:
          path: plugin

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pgsql, zip, gd, xmlrpc, soap
          ini-values: max_input_vars=5000
          coverage: none

      - name: Initialise moodle-plugin-ci
        run: |
          composer create-project -n --no-dev --prefer-dist moodlehq/moodle-plugin-ci ci ^4
          echo $(cd ci/bin; pwd) >> $GITHUB_PATH
          echo $(cd ci/vendor/bin; pwd) >> $GITHUB_PATH
          sudo locale-gen en_AU.UTF-8
          echo "NVM_DIR=$HOME/.nvm" >> $GITHUB_ENV

      - name: Install moodle-plugin-ci
        run: moodle-plugin-ci install --plugin ./plugin --db-host=127.0.0.1 --no-init
        env:
          DB: pgsql
          MOODLE_BRANCH: MOODLE_500_STABLE

      - name: Build
        run: |
          cd moodle/local/evenements
          npx grunt amd --force
          for f in amd/build/*; do echo "AMDFILE $(basename $f) $(base64 -w0 $f)"; done

      - name: Keep the build
        uses: actions/upload-artifact@v4
        with:
          name: amd-build
          path: moodle/local/evenements/amd/build
