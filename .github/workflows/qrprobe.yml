name: QR probe (temporary)
on:
  push:
    paths:
      - '.github/workflows/qrprobe.yml'
jobs:
  probe:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        php: ['8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Probe
        run: |
          git clone -q --depth 1 --filter=blob:none --sparse -b MOODLE_503_STABLE https://github.com/moodle/moodle.git m
          (cd m && git sparse-checkout set public/lib/tcpdf)
          php -d opcache.enable_cli=1 -d opcache.jit=tracing -d opcache.jit_buffer_size=64M .github/qrrand.php m/public/lib/tcpdf
          php .github/qrrand.php m/public/lib/tcpdf
          php -m | tr '\n' ' '
